name: Docs site

# Builds the MkDocs (Material) documentation site AND assembles the signed APT
# (deb/) and DNF (rpm/) package repositories into one GitHub Pages site. This is
# the single authoritative deployer: the publish workflow only updates deb/**,
# rpm/** in the repo, and the resulting push re-runs this to redeploy the whole
# site. Runs on free GitHub-hosted runners (this is a public repository).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'deb/**'
      - 'rpm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install "mkdocs-material==9.*"
      - run: mkdocs build
      - name: Assemble package repositories into the site
        run: |
          # Serve the signed APT/DNF trees verbatim alongside the docs. .nojekyll
          # keeps Pages from processing files/dirs (e.g. pool/, dists/) with Jekyll.
          touch _site/.nojekyll
          [ -d deb ] && cp -r deb _site/deb || true
          [ -d rpm ] && cp -r rpm _site/rpm || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
